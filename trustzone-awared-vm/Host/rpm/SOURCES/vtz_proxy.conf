# vtz_proxy configuration file 
# 
# ============================================================================ 
# VM Socket Configuration 
# ============================================================================ 


# max_vm_count: Maximum number of VMs supported 
# This defines the maximum number of concurrent VMs that can connect. 
# Range: 1-64 
# Default: 64 
# 
max_vm_count = 64 


# ============================================================================ 
# NUMA CPU Binding Configuration 
# ============================================================================ 
# 
# Supported formats(cpu cores)： 
# - Single CPU: "0", "1", "2" 
# - CPU list: "0,1,2,3" 
# - CPU range: "0-3" 
# - Mixed format: "0,22-48,6" 
# 
# Default: last 8 cpu cores 


numa_bindings = 8-15 


# ============================================================================ 
# vpuset map Configuration 
# ============================================================================ 
# 
# Map the ta_cpu_set to the set of physical CPUs bound to the corresponding vCPUs. 
# Defaluts if omiited. 
# 
# legal value(Case-insensitive): 
#   true 
#   false 
# 
# Default: true 
 
 
use_vcpuset = true


# ============================================================================ 
# QEMU Binary Configuration 
# ============================================================================ 
# 
# Specify the QEMU executable binary to be used for virtual machine crateion.
# This determines the virtualization backend and architecture support.
# 
# Support values:
#   qemu-systemctl-aarch64    - For ARM64/AArch64 virtualization
#   qemu-kvm                  - For KVM-based virtualization
# 
# Note: The binary must be installed and accessible in the system PATH.
#       Use 'which qemu-system-aatch' to verify availability.
 
# qemu_binary = qemu-system-aarch64