# vtzb_proxy configuration file
#
# ============================================================================
# VM Socket Configuration
# ============================================================================
#
# socket_path: Virtual serial port socket path prefix
# This is the path prefix for VM virtio-serial sockets.
# The actual socket path will be: <socket_path><vm_index>
# For example, if socket_path = /var/vtzb/vm_vtzb_sock, then:
#   VM 0 socket: /var/vtzb/vm_vtzb_sock0
#   VM 1 socket: /var/vtzb/vm_vtzb_sock1
#
# Note: Ensure the directory exists and has proper permissions.
# Default: /var/vtzb/vm_vtzb_sock
#
socket_path = /var/vtzb/vm_vtzb_sock

# max_vm_count: Maximum number of VMs supported
# This defines the maximum number of concurrent VMs that can connect.
# Range: 1-64
# Default: 64
#
max_vm_count = 64

# ============================================================================
# Libvirt Connection Configuration
# ============================================================================
#
# libvirt_uri: Libvirt connection URI
# Specifies the hypervisor connection URI for libvirt.
# Common values:
#   qemu:///system  - System-level QEMU/KVM (requires root or libvirt group)
#   qemu:///session - User session QEMU/KVM (user-level, no root required)
#   qemu+ssh://user@host/system - Remote connection via SSH
#   qemu+tcp://host/system - Remote connection via TCP
#
# Default: qemu:///system
#
libvirt_uri = qemu:///session

# ============================================================================
# NUMA CPU Binding Configuration
# ============================================================================
#
# Supported formats(cpu cores)：
# - Single CPU: "0", "1", "2"
# - CPU list: "0,1,2,3"
# - CPU range: "0-3"
# - Mixed format: "0,22-48,6"
#
# Default: last 8 cpu cores

numa_bindings = 8-15
